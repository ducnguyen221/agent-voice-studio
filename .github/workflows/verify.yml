name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Chỉ kiểm cú pháp. Engine TTS nặng vài GB và cần GPU — CI không cài,
      # và cũng không nên: repo này cố ý chạy được mà không có engine cho tới
      # lúc thật sự tổng hợp giọng.
      - name: Compile every script
        run: python -m compileall -q studio voice_studio extras tests

      # Cổng chống rò. Repo dạy cách tạo giọng, nó KHÔNG chứa giọng.
      # Danh sách này chặn hai thứ: file nhị phân của giọng/model, và dấu vết
      # danh tính của máy người viết.
      - name: No audio or model binaries committed
        run: |
          hits=$(git ls-files | grep -Ei '\.(wav|mp3|m4a|flac|ogg|opus|pt|ckpt|onnx|safetensors)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::Binary voice/model files must never be committed:"
            echo "$hits"
            exit 1
          fi
          echo "OK — no audio or model binaries tracked."

      # Cổng rò danh tính chỉ còn MỘT bản: tests/test_no_identity_leak.py.
      #
      # Trước đây bước này có một bản grep riêng. Hai bản, hai luật miễn trừ khác nhau: bản
      # grep chỉ loại trừ chính file workflow, nên nó bắt luôn mẫu BỊA nằm trong test đột
      # biến của chính cổng kia và báo đỏ giả. Bản trong tests/ mạnh hơn hẳn — miễn trừ theo
      # SỐ ĐẾM từng (file, mẫu) chứ không miễn cả file, tự kiểm regex bằng test đột biến, và
      # quét cả file chưa `git add`. Một luật, một chỗ — mẫu "biến môi trường trỏ thư mục
      # người dùng" mà chỉ bản grep cũ có đã được gộp sang đó (khoá `bien-home-win`).
      - name: No machine paths or personal identifiers
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_no_identity_leak.py

      # Nới miễn trừ mà không chứng minh lại = cổng mất răng trong im lặng. Bước này chèn một
      # chuỗi danh tính THẬT vào một file KHÁC (không nằm trong bất kỳ miễn trừ nào) và đòi
      # cổng phải đỏ. Bước trên xanh + bước này đỏ-đúng-lúc = cổng còn răng.
      - name: Identity gate still has teeth (mutation)
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          # Dựng chuỗi bằng chr() để chính file workflow này không tự khớp cổng.
          leak = "".join(map(chr, (67, 58, 92, 85, 115, 101, 114, 115, 92))) + "someone"
          probe = Path("extras/_mutation_probe.py")
          probe.write_text("# " + leak + "\n", encoding="utf-8")
          try:
              r = subprocess.run([sys.executable, "-m", "pytest", "-q",
                                  "tests/test_no_identity_leak.py"])
          finally:
              probe.unlink()
          if r.returncode == 0:
              print("::error::Identity gate lost its teeth: a real identity string in another "
                    "file still passed.")
              sys.exit(1)
          print("OK — the gate went red exactly when it had to.")
          PY

      - name: Plugin manifests are valid JSON and agree on version
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open('.claude-plugin/marketplace.json'))
          c = json.load(open('.claude-plugin/plugin.json'))
          x = json.load(open('.codex-plugin/plugin.json'))
          vers = {
              'marketplace': m['plugins'][0]['version'],
              'claude-plugin': c['version'],
              'codex-plugin': x['version'],
          }
          if len(set(vers.values())) != 1:
              print(f"::error::Version mismatch across manifests: {vers}")
              sys.exit(1)
          names = {m['name'], m['plugins'][0]['name'], c['name'], x['name']}
          if len(names) != 1:
              print(f"::error::Name mismatch across manifests: {names}")
              sys.exit(1)
          print(f"OK — {names.pop()} {vers['claude-plugin']} consistent across 3 manifests.")
          PY

      - name: Skill references all exist
        run: |
          python - <<'PY'
          import os, re, sys
          skill = 'skills/voice-routing/SKILL.md'
          text = open(skill, encoding='utf-8').read()
          refs = set(re.findall(r'references/([a-z0-9\-]+\.md)', text))
          have = set(os.listdir('skills/voice-routing/references'))
          missing = refs - have
          orphan = have - refs
          if missing:
              print(f"::error::SKILL.md points at references that do not exist: {sorted(missing)}")
              sys.exit(1)
          if orphan:
              print(f"::warning::References never routed to from SKILL.md: {sorted(orphan)}")
          print(f"OK — {len(refs)} references resolved.")
          PY
