name: tests

# Chạy bộ test KHÔNG cần model: torch/omnivoice được thay bằng module giả trong tests/conftest.py.
# Hai hệ điều hành đích của trạm giọng: Windows và macOS.

# Chạy trên MỌI nhánh, không riêng `main`: công việc thật sống trên nhánh feature, và một CI
# chỉ nhìn `main` thì tới lúc merge mới biết đỏ — quá muộn để còn là cổng.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Quyền tối thiểu: job chỉ đọc mã, không ghi gì lên GitHub.
permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # 3.12 là bản đã đo với engine thật; 3.13/3.14 giữ cho lõi (numpy, soundfile) không vỡ
        # âm thầm khi người dùng mới cài Python mới nhất. Engine (torch, omnivoice) không chạy ở CI.
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      # Ghim SHA (kèm tag để đọc): tag có thể bị dời, SHA thì không.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (no torch, no engine)
        run: python -m pip install -e ".[test]"

      - name: Entry point works without the engine
        run: voice-studio --help

      - name: Init works in both modes (smoke)
        shell: bash
        run: |
          set -e
          tmp="$RUNNER_TEMP/vs"
          voice-studio init --station "$tmp/separate" --json
          test -f "$tmp/separate/station.json"
          voice-studio init --dry-run --yes --json

      - name: pytest
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

  # Extra `[clone]` cài THẬT rồi gọi `decode_audio` (Mac mini 01/10/2026: không ghim `av` ⇒ pip
  # kéo PyAV 19 ⇒ TypeError). Job pytest ở trên không cài extra nào ngoài `test`, nên không thấy
  # được lỗi này. `VOICE_STUDIO_REQUIRE_CLONE=1` biến skip thành đỏ.
  clone-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install package + [clone]
        run: python -m pip install -e ".[test,clone]"

      - name: decode_audio really runs with the pinned pair
        env:
          PYTHONIOENCODING: utf-8
          VOICE_STUDIO_REQUIRE_CLONE: "1"
        run: python -m pytest -q -rs tests/test_clone_runtime.py
