name: tests

# Chạy bộ test KHÔNG cần model: torch/omnivoice được thay bằng module giả trong tests/conftest.py.
# Hai hệ điều hành đích của trạm giọng: Windows và macOS.

# Chạy trên MỌI nhánh, không riêng `main`: công việc thật sống trên nhánh feature, và một CI
# chỉ nhìn `main` thì tới lúc merge mới biết đỏ — quá muộn để còn là cổng.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (no torch, no engine)
        run: python -m pip install -e ".[test]"

      - name: Entry point works without the engine
        run: voice-studio --help

      - name: Init works in both modes (smoke)
        shell: bash
        run: |
          set -e
          tmp="$RUNNER_TEMP/vs"
          voice-studio init --station "$tmp/separate" --json
          test -f "$tmp/separate/station.json"
          voice-studio init --dry-run --yes --json

      - name: pytest
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q
