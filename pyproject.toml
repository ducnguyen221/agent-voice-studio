[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-voice-studio"
version = "0.3.1"
description = "Engine mẫu chạy giọng quanh OmniVoice: tạo giọng, chuẩn hoá, đọc, nhạc nền — cài được, gọi được từ pipeline khác."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Lõi cố ý nhẹ: `voice-studio --help`, `init`, `doctor`, `export` chạy không cần torch.
# torch cài RIÊNG theo hệ điều hành (CUDA / CPU / Apple MPS) — xem
# skills/voice-routing/references/install-omnivoice.md; pip không chọn đúng bánh xe torch thay bạn.
dependencies = [
    "numpy",
    "soundfile",
]

[project.optional-dependencies]
# Engine: weights OmniVoice theo giấy phép CC-BY-NC (không thương mại) — đọc install-omnivoice.md.
# transformers ghim theo KHOẢNG đã đo, không một số cứng: 5.10.2 (Windows + CUDA) và 5.17.0
# (Windows cài sạch, Mac) đều chạy. omnivoice 0.2.1 chỉ đòi >=5.3.0 nên không tự chặn bản mới
# chưa ai thử. Nới khoảng = đo trên máy thật trước, rồi sửa cùng lúc doctor.TRANSFORMERS_TESTED
# (tests/test_repo_gates.py đỏ nếu hai chỗ lệch).
engine = ["omnivoice==0.2.1", "transformers>=5.10.2,<5.18"]
mcp = ["mcp"]
ui = ["gradio"]
clone = ["faster-whisper", "yt-dlp"]
lab = ["librosa", "scikit-learn"]
test = ["pytest"]

[project.scripts]
voice-studio = "voice_studio.cli:main"

[tool.setuptools.packages.find]
include = ["voice_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
